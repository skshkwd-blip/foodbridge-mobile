<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodBridge – Login</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* ================= THEME ================= */

/* DARK */
body.dark{
  --bg:#0a0a0a;
  --surface:#111;
  --surface2:#181818;
  --surface3:#1f1f1f;

  --primary:#3f9f6a;
  --primary-dark:#2f7a52;
  --primary-glow:rgba(63,159,106,0.18);

  --text:#f0ebe4;
  --muted:#7a7068;
  --border:#242424;
  --border-light:#2e2e2e;
}

/* LIGHT */
body.light{
  --bg:#fdf6ec;
  --surface:#fff8f0;
  --surface2:#ffffff;
  --surface3:#fef2e6;

  --primary:#c8522a;
  --primary-dark:#a94422;
  --primary-glow:rgba(200,82,42,0.14);

  --text:#2c1a0e;
  --muted:#8c7060;
  --border:#e8d8c8;
  --border-light:#ddc8b0;
}

/* GLOBAL */
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  height:100vh;
  overflow:hidden;
  transition:0.3s;
}

/* ================= LEFT PANEL ================= */
.left{
  flex:1.2;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:80px;
}

body.dark .left{
  background:linear-gradient(135deg,#121212,#0a0a0a);
}

body.light .left{
  background:linear-gradient(135deg,#fff3e8,#ffe0c7);
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:30px;
}

.logo-icon{
  width:44px;height:44px;
  background:linear-gradient(135deg,var(--primary),#e8784f);
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
}

.logo-text{
  font-family:'Playfair Display',serif;
  font-size:24px;
}
.logo-text span{color:var(--primary);}

.left h1{
  font-size:48px;
  margin-bottom:10px;
}

.left p{
  color:var(--muted);
  max-width:420px;
  font-size:15px;
}

/* ================= RIGHT PANEL ================= */
.right{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow-y:auto;
  padding:40px;
}

/* CARD */
.card{
  width:420px;
  max-width:100%;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:20px;
  padding:32px;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

/* ================= THEME BUTTON ================= */
.theme-toggle{
  position:absolute;
  top:20px;
  right:20px;
  padding:8px 14px;
  border-radius:8px;
  border:1px solid var(--border);
  background:none;
  color:var(--text);
  cursor:pointer;
  transition:0.2s;
}
.theme-toggle:hover{
  border-color:var(--primary);
  color:var(--primary);
}

/* ================= ROLE TABS ================= */
.role-tabs{
  display:flex;
  gap:6px;
  background:var(--bg);
  padding:4px;
  border-radius:10px;
  margin-bottom:20px;
}

.role-tab{
  flex:1;
  padding:10px;
  border:none;
  background:none;
  color:var(--muted);
  cursor:pointer;
  border-radius:8px;
  transition:0.2s;
}

.role-tab.active{
  background:var(--surface);
  color:var(--primary);
}

/* ================= FORM ================= */
.form-group{margin-bottom:14px;}

label{
  font-size:12px;
  color:var(--muted);
  margin-bottom:4px;
  display:block;
}

input{
  width:100%;
  padding:12px 16px;
  border-radius:10px;
  border:1.5px solid var(--border-light);
  background:var(--surface2);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  outline:none;
  transition:border 0.2s,background 0.2s,box-shadow 0.2s;
}

input::placeholder{color:var(--muted);opacity:0.55;}

input:focus{
  border-color:var(--primary);
  background:var(--surface3);
  box-shadow:0 0 0 4px var(--primary-glow);
}

/* ================= INPUT ICON WRAP (matches signup) ================= */
.input-icon-wrap{position:relative;}
.input-icon-wrap input{padding-left:44px;}
.input-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:16px;pointer-events:none;opacity:0.4;
}
.input-toggle{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;
  color:var(--muted);font-size:13px;
  font-family:'DM Sans',sans-serif;
  padding:0;transition:color 0.2s;
}
.input-toggle:hover{color:var(--primary);}

/* ================= BUTTON ================= */
.btn{
  width:100%;
  padding:13px;
  border:none;
  border-radius:10px;
  color:#fff;
  cursor:pointer;
  margin-top:10px;
  font-family:'DM Sans',sans-serif;
  font-size:15px;
  font-weight:600;
}

body.dark .btn{
  background:linear-gradient(135deg,#2f7a52,#3f9f6a);
}
body.light .btn{
  background:linear-gradient(135deg,#c8522a,#e8784f);
}

/* ================= ERROR ================= */
.error-msg{
  color:#ff6b6b;
  font-size:12px;
  margin-top:8px;
  display:none;
}

/* ================= DIVIDER ================= */
.divider{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin:15px 0;
}

/* ================= LINKS ================= */
.link-row{
  text-align:center;
  font-size:13px;
  color:var(--muted);
}

.link-row a{
  color:var(--primary);
  text-decoration:none;
}

.link-row a:hover{
  text-decoration:underline;
}

/* SCROLLBAR */
.right::-webkit-scrollbar{width:6px;}
.right::-webkit-scrollbar-thumb{
  background:var(--border);
  border-radius:10px;
}

/* RESPONSIVE */
@media(max-width:900px){
  body{flex-direction:column;}
  .left{display:none;}
}

</style>
</head>

<body class="dark">

<button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>

<!-- LEFT PANEL -->
<div class="left">
  <div class="logo">
    <div class="logo-text">Food<span>Bridge</span></div>
  </div>

  <h1>Welcome Back</h1>
  <p>Sign in and continue delivering impact through FoodBridge.</p>
</div>

<!-- RIGHT PANEL -->
<div class="right">
<div class="card">

<div class="role-tabs">
  <button class="role-tab active" onclick="setRole('donor',this)">Donor</button>
  <button class="role-tab" onclick="setRole('ngo',this)">NGO</button>
  <button class="role-tab" onclick="setRole('volunteer',this)">Volunteer</button>
</div>

<form method="POST" action="/do_login">

<input type="hidden" name="role" id="roleInput" value="donor">

<div class="form-group">
<label>Name</label>
<div class="input-icon-wrap">
  <input type="text" name="name"placeholder="Enter your name" required>
</div>
</div>

<div class="form-group">
<label>Password</label>
<div class="input-icon-wrap">
  <input type="password" name="password" id="passInput"placeholder="••••••••" required>
  <button type="button" class="input-toggle" onclick="togglePass()">Show</button>
</div>
</div>

<button type="submit" class="btn">Sign In</button>

<p class="error-msg">{{ error }}</p>

</form>

<div class="divider">or</div>

<div class="link-row">
Don't have an account? <a href="/signup">Sign up</a>
</div>

</div>
</div>

<script>
function setRole(role, el){
  document.getElementById("roleInput").value = role;
  document.querySelectorAll(".role-tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
}

/* ERROR DISPLAY */
const errorText = "{{ error }}";
if (errorText && errorText.trim() !== "") {
  document.querySelector(".error-msg").style.display = "block";
}

/* THEME LOAD */
(function () {
  const saved = localStorage.getItem("theme") || "dark";
  document.body.classList.remove("dark","light");
  document.body.classList.add(saved);

  if(saved === "light"){
    document.getElementById("themeBtn").innerText = "☀️";
  }
})();

/* THEME TOGGLE */
function toggleTheme() {
  const body = document.body;
  const btn = document.getElementById("themeBtn");

  if (body.classList.contains("dark")) {
    body.classList.replace("dark","light");
    localStorage.setItem("theme","light");
    btn.innerText = "☀️";
  } else {
    body.classList.replace("light","dark");
    localStorage.setItem("theme","dark");
    btn.innerText = "🌙";
  }
}

/* PASSWORD TOGGLE */
function togglePass() {
  const input = document.getElementById("passInput");
  const btn = input.nextElementSibling;
  if (input.type === "password") {
    input.type = "text";
    btn.textContent = "Hide";
  } else {
    input.type = "password";
    btn.textContent = "Show";
  }
}
</script>

</body>
</html>
